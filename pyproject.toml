[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatatp-studio"
version = "0.2.0"
description = "Official Python SDK for ChatATP Studio Developer API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Samuel Obinna Chimdi", email = "sammyfirst6@gmail.com" }
]

keywords = [
  "chatatp",
  "chatatp-studio",
  "agent-sdk",
  "ai-agents",
  "llm-agents",
  "chatbot-sdk",
  "api-client",
  "developer-tools",
  "async-client",
  "python-sdk"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License"
]

dependencies = [
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "mypy>=1.10",
  "build",
  "twine",
  "ruff"
]
cli = [
  "click>=8.1",
  "rich>=13.7",
  "requests>=2.31"
]

[project.scripts]
studio = "chatatp_studio.cli.__main__:main"

[project.urls]
Homepage = "https://studio.chat-atp.com"
Documentation = "https://studio.chat-atp.com/docs"
Source = "https://github.com/sam-14uel/chatatp_studio_python"
Issues = "https://github.com/sam-14uel/chatatp_studio_python/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true